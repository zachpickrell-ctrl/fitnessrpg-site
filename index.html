<!doctype html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitness RPG</title>
<meta name="description" content="Fitness RPG for iPhone and Apple Watch: support and privacy.">
<style>
  :root { --bg:#F3F4F8; --ink:#1A1E2C; --muted:#596074; --accent:#8A5B00; --rule:#DCDFE8; --surface:#FFFFFF; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0F121B; --ink:#E7E9F1; --muted:#9AA1B6; --accent:#F2C14E; --rule:#2A3042; --surface:#171B28; color-scheme: dark; } }
  body { font: 16px/1.6 -apple-system, "Helvetica Neue", Arial, sans-serif; margin: 0; padding: 48px 16px; background: var(--bg); color: var(--ink); }
  .wrap { max-width: 34rem; margin: 0 auto; }
  h1 { font-size: 32px; margin: 0 0 4px; }
  .tag { color: var(--muted); margin: 0 0 28px; }
  .card { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 16px 20px; margin-bottom: 14px; }
  .card h2 { font-size: 17px; margin: 0 0 6px; }
  .card p { margin: 0; }
  a { color: var(--accent); text-underline-offset: 3px; }
  .sep { color: var(--muted); padding: 0 6px; }
  footer { margin-top: 32px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Fitness RPG</h1>

  </div>
  <footer>Fitness RPG is not affiliated with Apple. Apple Watch and iPhone are trademarks of Apple Inc.</footer>
</div>
</body>
</html>
